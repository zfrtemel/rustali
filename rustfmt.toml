# Stable rustfmt options only: CI formats with the stable toolchain.
# (imports_granularity / group_imports / wrap_comments are still nightly-only; we keep
# import grouping by convention — std, external, crate — and reviewers enforce it.)
edition = "2024"
style_edition = "2024"
max_width = 100
use_small_heuristics = "Default"
newline_style = "Unix"
reorder_imports = true
reorder_modules = true
use_field_init_shorthand = true
use_try_shorthand = true
