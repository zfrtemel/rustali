# cargo-deny configuration: licenses, security advisories, duplicate/banned crates.
[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Our own unpublished crates (examples, xtask) carry no license field by design.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Path deps in examples/tests use `{ path = ... }` with no version (shows as wildcard);
# allow that for workspace-internal crates.
wildcards = "allow"
highlight = "all"
# Keep the dependency graph on a single HTTP/async stack.
deny = [
    { crate = "async-std", reason = "tokio is the only supported runtime" },
    { crate = "openssl", reason = "use rustls everywhere", wrappers = [] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
