[package]
name = "blog"
description = "Server-rendered CRUD with Askama views, validation, flash messages and CSRF"
version = "0.0.0"
edition = "2024"
publish = false

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
rustali = { path = "../../crates/rustali" }
askama = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
rustali = { path = "../../crates/rustali", features = ["test"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true }
