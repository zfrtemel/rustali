[package]
name = "hello"
description = "Smallest Rustali application: one HTML page and one JSON endpoint"
version = "0.0.0"
edition = "2024"
publish = false

# Application lint profile (also used by generated starters): strict on safety,
# relaxed on library-only lints such as `unreachable_pub` and `missing_docs`.
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
rustali = { path = "../../crates/rustali" }
tokio = { workspace = true }
serde = { workspace = true }
