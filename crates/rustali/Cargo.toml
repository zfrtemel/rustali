[package]
name = "rustali"
description = "Batteries-included full-stack web framework for Rust: Laravel's developer experience with .NET-style engineering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[features]
default = ["macros", "orm", "sqlite", "views", "sessions", "validation", "auth", "cache", "mail", "queue"]
macros = ["dep:rustali-macros"]
orm = ["dep:rustali-orm", "dep:rustali-migrate"]
views = ["dep:rustali-view"]
sessions = ["dep:rustali-session"]
validation = ["dep:rustali-validate"]
auth = ["dep:rustali-auth", "sessions"]
cache = ["dep:rustali-cache"]
mail = ["dep:rustali-mail"]
queue = ["dep:rustali-queue"]
test = ["dep:rustali-test"]
tera = ["rustali-view?/tera"]
redis = ["rustali-cache?/redis"]
sqlite = ["rustali-orm?/sqlite", "rustali-migrate?/sqlite"]
postgres = ["rustali-orm?/postgres", "rustali-migrate?/postgres"]
mysql = ["rustali-orm?/mysql", "rustali-migrate?/mysql"]

[dependencies]
rustali-core = { workspace = true }
rustali-macros = { workspace = true, optional = true }
rustali-orm = { workspace = true, optional = true, default-features = false }
rustali-migrate = { workspace = true, optional = true, default-features = false }
rustali-view = { workspace = true, optional = true }
rustali-session = { workspace = true, optional = true }
rustali-validate = { workspace = true, optional = true }
rustali-auth = { workspace = true, optional = true }
rustali-cache = { workspace = true, optional = true }
rustali-mail = { workspace = true, optional = true }
rustali-queue = { workspace = true, optional = true }
rustali-test = { workspace = true, optional = true }
axum = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
insta = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
trybuild = { workspace = true }
