[package]
name = "rustali-cache"
description = "Caching for the Rustali web framework: a Cache trait with in-memory and (optional) Redis stores, plus remember()"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
redis = ["dep:redis"]

[dependencies]
rustali-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
redis = { version = "0.27", optional = true, default-features = false, features = ["tokio-comp", "aio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
